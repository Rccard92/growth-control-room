[project]
name = "growth-control-room"
version = "0.1.0"
description = "Growth Control Room monorepo"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/connectors",
    "packages/skills",
]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
# Correctness-focused set. SIM (style simplifications) is deliberately out for
# now: it flags ~40 nested-with blocks in tests that are fine as they are.
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "B008",   # FastAPI dependencies are declared as call defaults
    "E501",   # long lines are reported by the formatter, not the linter
    "UP042",  # str+Enum is deliberate: StrEnum changes str() and would alter payloads
]

[tool.ruff.lint.isort]
# `app` lives under apps/api, so ruff cannot infer it is our own package.
known-first-party = ["app", "tests", "connectors", "skills"]

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/*" = ["E402"]  # tests set env vars before importing the app
"apps/api/app/models/*" = ["F821"]  # SQLAlchemy resolves relationship targets by name

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]
