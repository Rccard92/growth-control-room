[project]
name = "gcr-connectors"
version = "0.1.0"
description = "Integration connectors for Growth Control Room"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["connectors"]
