services:
  postgres:
    image: postgres:16-alpine
    container_name: gcr-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gcr
      POSTGRES_PASSWORD: gcr_dev
      POSTGRES_DB: growth_control_room
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcr -d growth_control_room"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
